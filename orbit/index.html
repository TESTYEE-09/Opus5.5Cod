<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Orbit</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between;
         font: 600 16px system-ui, sans-serif; color: #cfe3ff; pointer-events: none; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         font: 16px system-ui, sans-serif; color: #cfe3ff; text-align: center; pointer-events: none; }
  #msg h1 { font-size: 48px; margin: 0 0 8px; letter-spacing: 6px; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">Stars 0</span><span id="fuel">Fuel 100</span><span id="best">Best 0</span></div>
<div id="msg"><h1>ORBIT</h1><p>Hold to thrust toward the pointer. Planets pull you in.<br>Collect stars for fuel and points. Don't crash.</p><p>Click or tap to start</p></div>
<script type="module" src="./main.js"></script>
</body>
</html>
